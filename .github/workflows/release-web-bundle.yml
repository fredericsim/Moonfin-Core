name: Build Moonfin Web Bundle

on:
  workflow_run:
    workflows:
      - Checks
    types:
      - completed
  workflow_dispatch:
    inputs:
      plugin_mode:
        description: Enable plugin mode in generated config.json
        type: boolean
        default: true
      enable_webrtc_scan:
        description: Enable browser WebRTC subnet scan
        type: boolean
        default: true
      default_server_url:
        description: Optional default server URL
        type: string
        default: ''
      discovery_proxy_url:
        description: Optional discovery proxy URL
        type: string
        default: ''
      forced_server_url:
        description: Optional forced server URL
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: moonfin-web-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.2'

jobs:
  build-web-bundle:
    # Automatic releases are created only after Checks passes for a push to
    # main. Pull-request, scheduled, tag, and failed check runs cannot publish.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-26.04
    steps:
      - name: Resolve source commit
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            SOURCE_SHA="$WORKFLOW_RUN_SHA"
          else
            SOURCE_SHA="$DISPATCH_SHA"
          fi

          if ! printf '%s' "$SOURCE_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Invalid source commit: $SOURCE_SHA" >&2
            exit 1
          fi

          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "short=${SOURCE_SHA:0:12}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.source.outputs.sha }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Resolve app version
        id: version
        run: |
          RAW_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | tr -d '[:space:]')
          SEMVER=$(echo "$RAW_VERSION" | cut -d'+' -f1)
          echo "raw=$RAW_VERSION" >> "$GITHUB_OUTPUT"
          echo "semver=$SEMVER" >> "$GITHUB_OUTPUT"

      - name: Build web bundle
        run: |
          flutter pub get
          flutter build web --wasm --release --base-href "/Moonfin/Web/"

      - name: Sync and validate Theme Editor
        run: |
          mkdir -p build/web/theme
          rsync -a --delete web/theme/ build/web/theme/

          for required_file in \
            build/web/theme/index.html \
            build/web/theme/css/styles.css \
            build/web/theme/js/app.js; do
            if [ ! -f "$required_file" ]; then
              echo "Missing required Theme Editor asset: $required_file" >&2
              exit 1
            fi
          done

      - name: Ensure jq is available
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y jq
          fi

      - name: Write runtime config
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PLUGIN_MODE: ${{ inputs.plugin_mode }}
          INPUT_ENABLE_WEBRTC_SCAN: ${{ inputs.enable_webrtc_scan }}
          INPUT_DEFAULT_SERVER_URL: ${{ inputs.default_server_url }}
          INPUT_DISCOVERY_PROXY_URL: ${{ inputs.discovery_proxy_url }}
          INPUT_FORCED_SERVER_URL: ${{ inputs.forced_server_url }}
        run: |
          PLUGIN_MODE=true
          ENABLE_WEBRTC_SCAN=true
          DEFAULT_SERVER_URL=""
          DISCOVERY_PROXY_URL=""
          FORCED_SERVER_URL=""

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            PLUGIN_MODE="$INPUT_PLUGIN_MODE"
            ENABLE_WEBRTC_SCAN="$INPUT_ENABLE_WEBRTC_SCAN"
            DEFAULT_SERVER_URL="$INPUT_DEFAULT_SERVER_URL"
            DISCOVERY_PROXY_URL="$INPUT_DISCOVERY_PROXY_URL"
            FORCED_SERVER_URL="$INPUT_FORCED_SERVER_URL"
          fi

          jq -n \
            --arg defaultServerUrl "$DEFAULT_SERVER_URL" \
            --arg discoveryProxyUrl "$DISCOVERY_PROXY_URL" \
            --arg forcedServerUrl "$FORCED_SERVER_URL" \
            --arg pluginMode "$PLUGIN_MODE" \
            --arg enableWebRtcScan "$ENABLE_WEBRTC_SCAN" \
            '{
              schemaVersion: 1,
              defaultServerUrl: (if ($defaultServerUrl | length) > 0 then $defaultServerUrl else null end),
              discoveryProxyUrl: (if ($discoveryProxyUrl | length) > 0 then $discoveryProxyUrl else null end),
              enableWebRtcScan: ($enableWebRtcScan == "true"),
              brandingName: "Moonfin",
              pluginMode: ($pluginMode == "true"),
              forcedServerUrl: (if ($forcedServerUrl | length) > 0 then $forcedServerUrl else null end)
            }' > build/web/config.json

      - name: Write build manifest
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_REF: ${{ github.event.workflow_run.head_branch || github.ref }}
        run: |
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          PLUGIN_MODE="$(jq -c '.pluginMode' build/web/config.json)"
          if [ "$PLUGIN_MODE" != "true" ] && [ "$PLUGIN_MODE" != "false" ]; then
            echo "Generated config.json has an invalid pluginMode value" >&2
            exit 1
          fi

          jq -n \
            --arg version "${{ steps.version.outputs.semver }}" \
            --arg commit "$SOURCE_SHA" \
            --arg ref "$SOURCE_REF" \
            --arg flutterVersion "${{ env.FLUTTER_VERSION }}" \
            --arg buildTime "$BUILD_TIME" \
            --argjson pluginMode "$PLUGIN_MODE" \
            '{
              schemaVersion: 1,
              version: $version,
              commit: $commit,
              ref: $ref,
              source: "fredericsim/Moonfin-Core",
              flutterVersion: $flutterVersion,
              baseHref: "/Moonfin/Web/",
              pluginMode: $pluginMode,
              buildTime: $buildTime
            }' > build/web/build-manifest.json

      - name: Package web bundle
        run: |
          for required_file in \
            build/web/theme/index.html \
            build/web/theme/css/styles.css \
            build/web/theme/js/app.js; do
            test -f "$required_file"
          done

          tar -czf moonfin-web.tar.gz -C build/web .
          sha256sum moonfin-web.tar.gz > moonfin-web.tar.gz.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: moonfin-web-${{ steps.source.outputs.short }}
          path: |
            moonfin-web.tar.gz
            moonfin-web.tar.gz.sha256
            build/web/build-manifest.json
          if-no-files-found: error

      - name: Confirm release source is current main
        id: promotion
        if: github.event_name == 'workflow_run'
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          CURRENT_MAIN_SHA="$(git ls-remote origin refs/heads/main | awk 'NR == 1 { print $1 }')"
          if ! printf '%s' "$CURRENT_MAIN_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Could not resolve the current main commit" >&2
            exit 1
          fi

          if [ "$SOURCE_SHA" = "$CURRENT_MAIN_SHA" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale web release for $SOURCE_SHA; main is $CURRENT_MAIN_SHA"
          fi

      - name: Publish versioned web release
        if: >-
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          steps.promotion.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: moonfin-web-${{ steps.source.outputs.short }}
          target_commitish: ${{ steps.source.outputs.sha }}
          name: Moonfin Web ${{ steps.source.outputs.short }}
          body: |
            Automated plugin-mode Moonfin web build from commit `${{ steps.source.outputs.sha }}`.

            This bundle is intended for Moonbase at `/Moonfin/Web/`.
          make_latest: false
          files: |
            moonfin-web.tar.gz
            moonfin-web.tar.gz.sha256
            build/web/build-manifest.json
